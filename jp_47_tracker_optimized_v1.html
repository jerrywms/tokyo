<style>

  .foot{padding:16px 0 0;text-align:center;color:var(--muted);font-size:10px}.toast{position:fixed;left:50%;bottom:22px;z-index:60;translate:-50% 16px;padding:10px 14px;border-radius:11px;background:#17212b;color:#fff;box-shadow:var(--shadow);font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;translate:-50% 0}

  @media(max-width:900px){.map-stage,#jpSvg{min-height:440px}.overview{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.search-wrap{grid-column:1/-1}.actions{justify-content:flex-end}.tiles{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}}
  @media(max-width:620px){.shell{width:min(100% - 20px,1320px)}.save span{display:none}main{padding-top:10px}.map-head{padding:14px}.map-head h2{font-size:17px}.map-head p{max-width:250px}.map-stage{margin:8px;min-height:335px}.map-stage::before{background-size:17px 17px}#jpSvg{min-height:335px}.legend{padding:0 10px 10px}.legend button{padding:4px 7px}.map-editor{left:9px;bottom:9px;width:calc(100% - 18px);padding:10px}.palette{gap:4px}.state-btn{min-height:34px;font-size:0}.state-btn::before{width:15px;height:15px;margin:0 auto}.overview{margin-top:10px}.score{min-height:132px;padding:18px}.score-value{font-size:44px}.ring{width:82px}.stats{padding:9px;gap:7px}.stat{padding:10px}.stat-value{font-size:18px}.controls{grid-template-columns:1fr;padding:0 10px 10px}.search-wrap{grid-column:auto}.actions{display:grid;grid-template-columns:1fr auto auto}.regions{padding:10px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:108px}.region{padding:10px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* 列島拼圖：固定示意座標，不依賴外部地理資料。 */
  .map-stage{background:linear-gradient(145deg,#f6fbfc,#eaf5f7 70%,#e5f1f4);min-height:0;margin:14px;}
  .map-stage::before{display:none}
  #jpSvg{min-height:0;aspect-ratio:1100/710;}
  .pref{stroke:none;filter:none;outline:none;transition:opacity .18s;}
  .pref:hover,.pref.active{filter:none;stroke:none;}

  .piece-status{font-size:9px;font-weight:500;fill:#354b54;stroke:none;text-anchor:middle;pointer-events:none;opacity:.82;}
  
  
  .atlas-copy{fill:#6e8b94;font-size:12px;}
  .sea-name{fill:#86a5ae;font-size:13px;letter-spacing:5px;}

    .state-btn{font-size:10px;min-height:52px;}.state-btn::before{margin:0 auto 4px;}
  }

<body>
<header><div class="shell topbar"><div class="brand"><div class="brand-mark">🗾</div><div><h1>日本 47 都道府縣・征服統計</h1></div></div><div id="save" class="save" role="status"><i></i><span>已儲存於此裝置</span></div></div></header>
<main class="shell">
  <section class="card map-card">
    <div class="map-head"><div><h2>日本足跡地圖</h2><p>點選都道府縣以更新狀態。</p></div><span id="mapCount" class="map-count">顯示 47 個</span></div>
    <div id="mapStage" class="map-stage">
      <svg id="jpSvg" viewBox="0 0 1100 710" preserveAspectRatio="xMidYMid meet" aria-label="日本都道府縣足跡地圖"></svg>
      <div id="mapLoading" class="map-loading"><div><div class="spinner"></div>正在準備列島示意圖…</div></div>
      <div id="mapEditor" class="map-editor" role="dialog" aria-labelledby="editorName" hidden><div class="editor-top"><div><strong id="editorName"></strong><small id="editorSub"></small></div><button id="editorClose" class="close" type="button" aria-label="關閉">×</button></div><div id="editorPalette" class="palette"></div></div>
    </div>
    <div class="map-notes"><p>示意圖，非等比例。</p></div>
    <div id="legend" class="legend" aria-label="狀態圖例"></div>
  </section>

  <section class="overview">
    <article class="card score"><div><div class="score-kicker">🏆 制縣總分</div><div class="score-line"><strong id="score" class="score-value">0</strong><span class="score-max">／235 分</span></div></div><div id="ring" class="ring"><span><b id="scorePct">0%</b><small>完成度</small></span></div></article>
    <article class="card stats"><div class="stat"><div class="stat-label">已踏足<br>含路過</div><div id="touched" class="stat-value">0 / 47</div><div class="progress"><i id="touchedBar"></i></div></div><div class="stat"><div class="stat-label">到訪<br>遊玩以上</div><div id="visited" class="stat-value">0 / 47</div><div class="progress"><i id="visitedBar"></i></div></div><div class="stat"><div class="stat-label">深度／長住<br>住宿以上</div><div id="deep" class="stat-value">0 / 47</div><div class="progress"><i id="deepBar"></i></div></div></article>
  </section>

  <section class="card tracker-card">
    <div class="tracker-head"><h2>都道府縣一覽</h2></div>
    <div class="controls"><label class="search-wrap"><span class="hidden">搜尋</span><input id="search" class="control" type="search" placeholder="搜尋中文、日文或羅馬拼音（按 /）"></label><select id="statusFilter" class="control" aria-label="依狀態篩選"><option value="all">全部狀態</option></select><select id="regionFilter" class="control" aria-label="依區域篩選"><option value="all">全部區域</option></select><div class="actions"><button id="export" class="btn primary" type="button">匯出備份</button><label class="btn" for="import">匯入</label><input id="import" class="hidden" type="file" accept=".json,application/json"><button id="reset" class="btn danger" type="button" aria-label="重置全部資料">⌫</button></div></div>
    <div id="regions" class="regions"></div><div id="empty" class="empty">沒有符合目前條件的都道府縣。</div>
  </section>
  <div class="foot">資料僅保存在此瀏覽器。</div>
</main>

["tokushima","德島縣","徳島県","Tokushima","四國"],["kagawa","香川縣","香川県","Kagawa","四國"],["ehime","愛媛縣","愛媛県","Ehime","四國"],["kochi","高知縣","高知県","Kōchi","四國"],
["fukuoka","福岡縣","福岡県","Fukuoka","九州・沖繩"],["saga","佐賀縣","佐賀県","Saga","九州・沖繩"],["nagasaki","長崎縣","長崎県","Nagasaki","九州・沖繩"],["kumamoto","熊本縣","熊本県","Kumamoto","九州・沖繩"],["oita","大分縣","大分県","Ōita","九州・沖繩"],["miyazaki","宮崎縣","宮崎県","Miyazaki","九州・沖繩"],["kagoshima","鹿兒島縣","鹿児島県","Kagoshima","九州・沖繩"],["okinawa","沖繩縣","沖縄県","Okinawa","九州・沖繩"]
].map(([id,zh,jp,romaji,region])=>({id,zh,jp,romaji,region}));
const KEY="jp47-tracker-v2",OLD="jp47-tracker-v1";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const blank=()=>Object.fromEntries(PREFS.map(p=>[p.id,{status:0,visits:0,note:""}]));
function normalize(o){const n=blank();PREFS.forEach(p=>{const x=o?.[p.id]||{};n[p.id]={status:Math.min(5,Math.max(0,+x.status||0)),visits:Math.max(0,+x.visits||0),note:String(x.note||"")}});return n}
function migrate(o){const n=normalize(o);PREFS.forEach(p=>{if(n[p.id].status>=2)n[p.id].status=Math.min(5,n[p.id].status+1)});return n}
function load(){try{const v=localStorage.getItem(KEY);if(v)return normalize(JSON.parse(v));const old=localStorage.getItem(OLD);if(old){const n=migrate(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(n));return n}}catch{}return blank()}
let STATE=load(),selected=null,saveTimer=null,toastTimer=null;
function persist(){const el=$("#save");el.classList.add("saving");el.lastElementChild.textContent="儲存中…";clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(STATE));el.classList.remove("saving");el.lastElementChild.textContent="已儲存於此裝置"}catch{el.lastElementChild.textContent="無法儲存"}},120)}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2300)}
function setStatus(id,status){STATE[id].status=+status;persist();sync(id);stats();filter();if(selected===id)syncEditor()}
function short(n){return n.replace(/[縣府都]$/,"")}
function buildUI(){
 STATUS.forEach(s=>$("#statusFilter").add(new Option(`${s.label}・${s.k} 分`,s.k)));REGIONS.forEach(r=>$("#regionFilter").add(new Option(r,r)));
 $("#legend").innerHTML=STATUS.map(s=>`<button type="button" data-status="${s.k}"><i class="swatch" style="--c:${COLORS[s.k]}"></i>${s.label}・${s.k}</button>`).join("");
 $("#editorPalette").innerHTML=STATUS.map(s=>`<button type="button" class="state-btn" data-status="${s.k}" style="--c:${COLORS[s.k]}">${s.label}</button>`).join("");
 const regions=$("#regions");REGIONS.forEach(region=>{const prefs=PREFS.filter(p=>p.region===region),box=document.createElement("section");box.className="region";box.dataset.region=region;box.innerHTML=`<div class="region-head"><strong>${region}</strong><span>${prefs.length} 都道府縣</span></div><div class="tiles"></div>`;const grid=$(".tiles",box);prefs.forEach(p=>{const tile=document.createElement("article");tile.className="tile";tile.dataset.pid=p.id;tile.innerHTML=`<div class="tile-name">${short(p.zh)}</div><small class="tile-sub">${p.jp}・${p.romaji}</small><span class="tile-status"></span><div class="mini-palette">${STATUS.map(s=>`<button type="button" class="mini-state" data-status="${s.k}" style="--c:${COLORS[s.k]}" aria-label="${p.zh}：${s.label}" title="${s.label}"></button>`).join("")}</div>`;grid.appendChild(tile);$$('.mini-state',tile).forEach(b=>b.addEventListener('click',()=>setStatus(p.id,b.dataset.status)))});regions.appendChild(box)});
 $$('#legend button').forEach(b=>b.addEventListener('click',()=>{const f=$('#statusFilter');f.value=f.value===b.dataset.status?'all':b.dataset.status;filter()}));$$('.state-btn').forEach(b=>b.addEventListener('click',()=>setStatus(selected,b.dataset.status)));
}
function sync(id){const s=STATE[id],tile=$(`.tile[data-pid="${id}"]`);if(tile){tile.dataset.status=s.status;tile.style.setProperty('--tile',COLORS[s.status]);$('.tile-status',tile).textContent=`${STATUS[s.status].label}・${s.status} 分`;$$('.mini-state',tile).forEach(b=>b.classList.toggle('active',+b.dataset.status===s.status))}$$(`.pref[data-pid="${id}"]`).forEach(p=>{p.style.fill=COLORS[s.status];p.dataset.status=s.status;const label=$('.piece-status',p);if(label)label.textContent=MAP_STATUS[s.status];p.setAttribute('aria-label',`${PREFS.find(x=>x.id===id).zh}，${STATUS[s.status].label}`)})}
function stats(){let t=0,v=0,d=0,score=0;PREFS.forEach(p=>{const s=STATE[p.id].status;if(s>=1)t++;if(s>=3)v++;if(s>=4)d++;score+=s});$('#score').textContent=score;$('#touched').textContent=`${t} / 47`;$('#visited').textContent=`${v} / 47`;$('#deep').textContent=`${d} / 47`;$('#touchedBar').style.setProperty('--w',`${t/47*100}%`);$('#visitedBar').style.setProperty('--w',`${v/47*100}%`);$('#deepBar').style.setProperty('--w',`${d/47*100}%`);const pc=Math.round(score/235*100);$('#scorePct').textContent=`${pc}%`;$('#ring').style.setProperty('--p',`${score/235*360}deg`)}
function matches(p){const q=$('#search').value.trim().toLowerCase(),s=$('#statusFilter').value,r=$('#regionFilter').value,h=`${p.zh} ${p.jp} ${p.romaji}`.toLowerCase();return(!q||h.includes(q))&&(s==='all'||STATE[p.id].status===+s)&&(r==='all'||p.region===r)}
function filter(){const ids=new Set(PREFS.filter(matches).map(p=>p.id));PREFS.forEach(p=>{$(`.tile[data-pid="${p.id}"]`)?.classList.toggle('hidden',!ids.has(p.id));$$(`.pref[data-pid="${p.id}"]`).forEach(x=>x.classList.toggle('dim',!ids.has(p.id)))});$$('.region').forEach(r=>r.classList.toggle('hidden',!$('.tile:not(.hidden)',r)));$('#mapCount').textContent=`顯示 ${ids.size} 個`;$('#empty').style.display=ids.size?'none':'block';$$('#legend button').forEach(b=>b.classList.toggle('active',$('#statusFilter').value===b.dataset.status))}
function openEditor(id){selected=id;syncEditor();$('#mapEditor').hidden=false;$$('.pref').forEach(p=>p.classList.toggle('active',p.dataset.pid===id));$('#editorPalette .active')?.focus({preventScroll:true})}
function closeMapEditor(){const wasOpen=!$('#mapEditor').hidden;$('#mapEditor').hidden=true;$$('.pref.active').forEach(p=>p.classList.remove('active'));if(wasOpen)$(`.pref[data-pid="${selected}"]`)?.focus({preventScroll:true})}
function syncEditor(){const p=PREFS.find(x=>x.id===selected);if(!p)return;$('#editorName').textContent=p.zh;$('#editorSub').textContent=`${p.jp}・${p.romaji}・${p.region}`;$$('.state-btn').forEach(b=>b.classList.toggle('active',+b.dataset.status===STATE[selected].status))}
function controls(){['search','statusFilter','regionFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',filter));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMapEditor();if(e.key==='/'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}});$('#editorClose').addEventListener('click',closeMapEditor);$('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({schema:'jp47-tracker',version:2,exportedAt:new Date().toISOString(),data:STATE},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`jp47-tracker-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('備份已匯出')});$('#import').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const p=JSON.parse(await file.text());if(p?.schema==='jp47-tracker'&&p?.version===2&&p?.data)STATE=normalize(p.data);else STATE=confirm('這是沒有版本標記的舊備份。\n\n按「確定」以最舊版遷移；按「取消」保留目前分數。')?migrate(p):normalize(p);persist();PREFS.forEach(x=>sync(x.id));stats();filter();toast('備份匯入成功')}catch{alert('匯入失敗，請確認 JSON 格式。')}finally{e.target.value=''}});$('#reset').addEventListener('click',()=>{if(!confirm('確定要重置全部資料嗎？建議先匯出備份。'))return;STATE=blank();persist();PREFS.forEach(p=>sync(p.id));stats();filter();$('#mapEditor').hidden=true;toast('已重置全部資料')})}
// [欄、列、寬、高]：以列島的相對方位排列；面積與鄰接不代表實際地理邊界。
const MAP_LAYOUT={
 hokkaido:[13,0,2,1.65],aomori:[12,2,2,1],akita:[12,3],iwate:[13,3],yamagata:[12,4],miyagi:[13,4],fukushima:[12,5,2,1],
 gunma:[11,6],tochigi:[12,6],ibaraki:[13,6],saitama:[11,7,2,1],chiba:[13,7,1,2],tokyo:[11,8,2,1],kanagawa:[11,9,2,1],
 niigata:[11,4,1,2],toyama:[10,5],ishikawa:[9,5],fukui:[8,6],nagano:[10,6,1,2],gifu:[9,6,1,2],yamanashi:[10,8],aichi:[9,8],shizuoka:[10,9],mie:[8,8,1,2],
 kyoto:[7,6],shiga:[8,7],hyogo:[6,6,1,2],osaka:[7,7],nara:[7,8],wakayama:[7,9],
 shimane:[4,6],tottori:[5,6],yamaguchi:[3,7],hiroshima:[4,7],okayama:[5,7],
 ehime:[4,9],kagawa:[5,9],kochi:[4,10],tokushima:[5,10],
 fukuoka:[2,8],saga:[1,8],nagasaki:[0,9],kumamoto:[1,9],oita:[2,9],kagoshima:[1,10],miyazaki:[2,10],okinawa:[0,5]
};
const MAP_STATUS=['未到訪','路過','轉乘','遊玩','住宿','居住'];
const mapMedia=window.matchMedia('(max-width:620px)');
function layoutMap(){
 const mobile=mapMedia.matches,svg=$('#jpSvg');
 svg.setAttribute('viewBox',mobile?'0 0 600 1120':'0 0 1100 710');
 $$('.pref',svg).forEach(el=>{
  const id=el.dataset.pid,[c,r,w=1,h=1]=MAP_LAYOUT[id];let x=52+c*65,y=43+r*53;
  if(mobile){
   // 東日本、西日本上下分段；每段內維持相同方位，避免在小螢幕壓縮縣名。
   if(c>=9 || ['fukui','mie'].includes(id)){x=30+(c-8)*75;y=35+r*55;}
   else{x=22+c*64;y=690+(r-6)*65;if(id==='okinawa'){x=35;y=1010;}}
  }
  el.setAttribute('transform',`translate(${x},${y})`);
  const width=mobile?(c>=9||['fukui','mie'].includes(id)?w*75-6:w*64-6):w*65-5;
  const height=mobile?(c>=9||['fukui','mie'].includes(id)?h*55-5:h*65-6):h*53-5;
  const shape=$('.map-piece',el);shape.setAttribute('width',width);shape.setAttribute('height',height);
  $('.piece-name',el).setAttribute('x',width/2);$('.piece-name',el).setAttribute('y',height/2-1);
  $('.piece-status',el).setAttribute('x',width/2);$('.piece-status',el).setAttribute('y',height/2+14);
 });tipHide();
}

 const svg=$('#jpSvg'),ns='http://www.w3.org/2000/svg';
 svg.innerHTML=`<title>日本 47 都道府縣列島示意圖</title><desc>依相對方位排列，非等比例地圖。每個都道府縣均可點選或使用鍵盤更新征服狀態。小螢幕以東日本和西日本上下分段呈現。</desc>

 </g>

  el.innerHTML=`<rect class="map-piece" rx="7"/><text class="piece-name">${short(p.zh)}</text><text class="piece-status"></text>`;
  el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){tipShow(p.id);tipMove(e)}});el.addEventListener('pointermove',tipMove);el.addEventListener('pointerleave',tipHide);
  el.addEventListener('click',()=>{tipHide();openEditor(p.id)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor(p.id)}});
  svg.appendChild(el);sync(p.id);
 });layoutMap();$('#mapLoading').hidden=true;filter();
}
mapMedia.addEventListener('change',layoutMap);
let tip;function tipShow(id){const p=PREFS.find(x=>x.id===id);if(!tip){tip=document.createElement('div');tip.className='map-tip';$('#mapStage').appendChild(tip)}tip.textContent=`${p.zh}｜${STATUS[STATE[id].status].label}`;tip.hidden=false}function tipMove(e){if(!tip)return;const r=$('#mapStage').getBoundingClientRect();tip.style.left=`${Math.min(e.clientX-r.left+12,r.width-tip.offsetWidth-8)}px`;tip.style.top=`${Math.min(e.clientY-r.top+12,r.height-tip.offsetHeight-8)}px`}function tipHide(){if(tip)tip.hidden=true}
function loadMap(){draw()}
buildUI();controls();PREFS.forEach(p=>sync(p.id));stats();filter();loadMap();
</script>
