      function linkify(txt=''){
        let out = String(txt ?? '');
        const entries = Object.entries(POI_LINKS).sort((a,b)=>b[0].length-a[0].length);
        const placeholders = [];
        entries.forEach(([k,url], idx)=>{
          if(!k) return; const ph = `__POI_${idx}__`;
          if (out.indexOf(k) !== -1) { out = out.split(k).join(ph); placeholders[idx] = `<a href="${url}" target="_blank" rel="noopener" class="underline decoration-dotted">${k}</a>`; }
          else { placeholders[idx] = null; }
        });
        placeholders.forEach((html, idx)=>{ if(html) out = out.split(`__POI_${idx}__`).join(html); });
        return out;
      }
      const ul = items => `<ul class="list-disc pl-5 space-y-1">${(items||[]).map(i=>`<li>${linkify(i)}</li>`).join('')}</ul>`;

      const cardHTML = (d, det) => `

      function bindModeToggle(){
        const btn = document.getElementById('modeToggle'); if(!btn) return;
        const sync = () => btn.textContent = document.body.classList.contains('mode-natural') ? '顯示模式：原比例' : '顯示模式：一致尺寸';
        btn.addEventListener('click', ()=>{ document.body.classList.toggle('mode-natural'); sync(); });
        sync();
      }

      function bindLightbox(){
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightboxImg');
        const lbClose = document.getElementById('lightboxClose');
        const btnPrev = document.getElementById('lightboxPrev');
        const btnNext = document.getElementById('lightboxNext');
        const counter = document.getElementById('lightboxCounter');
        if(!lb || !lbImg) return;

        let currentList = [];
        let currentIndex = 0;

        const getFullSrc = (imgEl)=> imgEl.getAttribute('data-fullsrc') || imgEl.src;
        const updateCounter = ()=>{ if(counter){ counter.textContent = (currentList.length ? `${currentIndex+1} / ${currentList.length}` : ''); } };

        function showAt(idx){
          if(!currentList.length) return;
          currentIndex = (idx + currentList.length) % currentList.length;
          lbImg.src = currentList[currentIndex];
          const pre1 = new Image(); pre1.src = currentList[(currentIndex+1)%currentList.length];
          const pre2 = new Image(); pre2.src = currentList[(currentIndex-1+currentList.length)%currentList.length];
          updateCounter();
        }
        function openFrom(img){
          const grid = img.closest('.gallery-grid');
          const imgs = grid ? Array.from(grid.querySelectorAll('img')) : [img];
          currentList = imgs.map(getFullSrc);
          currentIndex = Math.max(0, imgs.indexOf(img));
          showAt(currentIndex);
          if(typeof lb.showModal === 'function') lb.showModal();
        }

        document.querySelectorAll('.gallery-grid img').forEach(img => {
          img.addEventListener('click', () => openFrom(img), {passive:true});
        });

        btnPrev && btnPrev.addEventListener('click', ()=> showAt(currentIndex-1));
        btnNext && btnNext.addEventListener('click', ()=> showAt(currentIndex+1));

        window.addEventListener('keydown', (e)=>{
          if(!lb.open) return;
          if(e.key==='Escape') lb.close();
          else if(e.key==='ArrowLeft') showAt(currentIndex-1);
          else if(e.key==='ArrowRight') showAt(currentIndex+1);
        });

        lb.addEventListener('click', (e)=>{ if(e.target===lb) lb.close(); });
        lbClose && lbClose.addEventListener('click', ()=> lb.close());

        let touchX = null;
        lbImg.addEventListener('touchstart', (e)=>{ touchX = e.touches[0].clientX; }, {passive:true});
        lbImg.addEventListener('touchend', (e)=>{
          if(touchX===null) return; const dx = (e.changedTouches[0].clientX - touchX);
          if(Math.abs(dx) > 40){ dx < 0 ? showAt(currentIndex+1) : showAt(currentIndex-1); }
          touchX = null;
        }, {passive:true});
      }

      function proxyURL(u, opts={}){
        try{
          const x = new URL(u);
          const params = new URLSearchParams();
          const w = opts.w || 1280; params.set('url', x.host + x.pathname + (x.search||'')); params.set('w', w); params.set('output', 'webp');
          return 'https://images.weserv.nl/?' + params.toString();
        }catch(e){ return u; }
      }
      function bindImgFallback(){
        const attach = (img)=>{
          const toProxy = () => { if(img.dataset.fallback) return; img.dataset.fallback = '1'; img.src = proxyURL(img.src); };
          img.addEventListener('error', toProxy, {passive:true});
          let timer = null;
          const onEnter = (entries)=>{ entries.forEach(en=>{ if(en.isIntersecting){ if(img.complete) return; if(timer) return; timer = setTimeout(()=>{ if(!img.complete) toProxy(); }, 2500); } }); };
          const io = new IntersectionObserver(onEnter, {rootMargin: '200px'}); io.observe(img);
          img.addEventListener('load', ()=>{ if(timer){ clearTimeout(timer); timer=null; } }, {passive:true});
        };
        document.querySelectorAll('img').forEach(attach);
        const obs = new MutationObserver((muts)=>{ muts.forEach(m=>{ m.addedNodes && m.addedNodes.forEach(node=>{ if(node.nodeType===1){ if(node.tagName==='IMG') attach(node); node.querySelectorAll && node.querySelectorAll('img').forEach(attach); } }); }); });
        obs.observe(document.body, {childList:true, subtree:true});
      }

      document.getElementById('dljson').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({DATA, DETAILS}, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'ibarakitohoku-9days.json'; a.click(); URL.revokeObjectURL(url);
      });

        try {
          console.assert(Array.isArray(DATA.itinerary), 'itinerary should be an array');
          console.assert(DATA.itinerary.length === 9, 'itinerary should have 9 days');
          const days = DATA.itinerary.map(d=>d.day);
          console.assert(days.join(',') === '1,2,3,4,5,6,7,8,9', 'days should be 1..9');
          console.assert(DATA.itinerary.every(d=>Array.isArray(d.gallery)), 'each day.gallery should be an array');
          console.assert(DATA.flights.outbound.depTime && DATA.flights.inbound.arrTime, 'flight times should be set');
          setTimeout(()=>{
            const wrap = document.getElementById('itineraryList');
            console.assert(wrap && wrap.children.length === 9, 'should render 9 day cards');
          }, 0);

          setTimeout(()=>{
            const firstImg = document.querySelector('.gallery-grid img');
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightboxImg');
            if(firstImg && lb && lbImg && typeof lb.showModal === 'function'){
              const grid = firstImg.closest('.gallery-grid');
              const imgs = grid ? Array.from(grid.querySelectorAll('img')) : [];
              firstImg.click();
              console.assert(lb.open === true, 'lightbox should be open after click');
              const before = lbImg.src;
              const ev = new KeyboardEvent('keydown', {key:'ArrowRight'});
              window.dispatchEvent(ev);
              if(imgs.length > 1){
                console.assert(lbImg.src !== before, 'lightbox image should change on ArrowRight');
              }
              lb.close();
            }
          }, 80);

          setTimeout(()=>{
            const btn = document.getElementById('modeToggle');
            if(btn){
              const wasNatural = document.body.classList.contains('mode-natural');
              btn.click();
              console.assert(document.body.classList.contains('mode-natural') !== wasNatural, 'modeToggle should toggle class');
              btn.click();
            }
          }, 60);
        } catch(e){
          console.error('Self-tests failed:', e);
        }
      }

      bindModeToggle();
      bindLightbox();
      bindImgFallback();
